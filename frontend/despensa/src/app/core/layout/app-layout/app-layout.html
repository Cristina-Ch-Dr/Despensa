<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<div class="app-layout">
	<header class="app-banner">
		<a class="brand-mark app-banner__brand" routerLink="/app" aria-label="La Despensa, ir al inicio">
			<span class="brand-mark__leaf" aria-hidden="true"></span>
			<span>la despensa</span>
		</a>
		<p class="app-banner__message">Tu compra, en compañía.</p>
	</header>

	<div class="app-layout__body">
		<aside class="app-sidebar" aria-label="Navegación de la aplicación">
			<p class="app-sidebar__heading">Accesos directos</p>
			<nav aria-label="Páginas">
				<ul class="app-sidebar__links">
					@for (item of navigationItems; track item.route) {
					<li>
						<a [routerLink]="item.route" routerLinkActive="app-sidebar__link--active"
							[routerLinkActiveOptions]="{ exact: item.exact }" ariaCurrentWhenActive="page"
							class="app-sidebar__link">
							<img class="app-sidebar__icon" [src]="item.icon" alt="" aria-hidden="true" />
							{{ item.label }}
						</a>
					</li>
					}
				</ul>
			</nav>
			<div class="app-sidebar__bottom">
				<button class="app-sidebar__link app-sidebar__logout" type="button" (click)="logout()">
					<img class="app-sidebar__icon" src="/assets/icons/logout.svg" alt="" aria-hidden="true" />
					Cerrar sesión
				</button>
			</div>
		</aside>

		<main class="app-content" id="main-content">
			<router-outlet />
		</main>
	</div>
</div>
